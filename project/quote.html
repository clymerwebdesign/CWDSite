<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get a Quote — Clymer Web Design</title>
<meta name="description" content="Build a free, no-commitment website estimate in under two minutes." />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="quote.css" />
</head>
<body class="quote-body">

<!-- background glass orbs -->
<div class="q-bg" aria-hidden="true">
  <span class="q-orb q-orb-1"></span>
  <span class="q-orb q-orb-2"></span>
  <span class="q-orb q-orb-3"></span>
</div>

<!-- progress bar -->
<div class="q-progress" aria-hidden="true"><div class="q-progress-fill" id="q-progress-fill"></div></div>

<!-- nav (light / interior) -->
<nav class="nav nav-interior" data-state="scrolled" id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo-link" aria-label="Clymer Web Design home">
      <img src="assets/cwd-icon-navy.png" alt="CWD" class="nav-logo is-navy" style="opacity:1;position:static" />
    </a>
    <div class="nav-links">
      <a href="index.html#work" class="nav-link nav-hideable">Work</a>
      <a href="index.html#about" class="nav-link nav-hideable">About</a>
      <a href="index.html" class="btn btn-ghost nav-cta">Home</a>
    </div>
  </div>
</nav>

<!-- builder stage -->
<main class="q-stage" id="q-stage" data-screen-label="Quote Builder">
  <div class="q-switch" role="tablist" aria-label="Quote flow style">
    <span class="q-switch-label">Try it as</span>
    <span class="q-switch-pill" id="q-switch-pill"></span>
    <button class="active" data-mode="guided" role="tab">Guided steps</button>
    <button data-mode="chat" role="tab">Chat</button>
  </div>
  <!-- #q-card injected by quote.js -->
</main>

<script src="quote.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="tweaks-app.jsx"></script>
</body>
</html>
